# nginx in front of Je viens aider.
#
# Install: copy to /etc/nginx/conf.d/jeviensaider.conf (or sites-available/
# + a link in sites-enabled), replace jeviensaider.example.org everywhere, then
#   nginx -t && systemctl reload nginx
#
# Certificate, with certbot (webroot mode, no downtime):
#   mkdir -p /var/www/letsencrypt
#   certbot certonly --webroot -w /var/www/letsencrypt -d jeviensaider.example.org
# Until the certificate exists, comment out the "listen 443" server block.
#
# The app must be told it is behind a proxy, with its public URL:
#   BENEVOLE_TRUST_PROXY=true
#   BENEVOLE_BASE_URL=https://jeviensaider.example.org
# and listen on 127.0.0.1:8080 only (the default of compose.yaml and of the
# systemd unit), so nobody can bypass nginx.

upstream jeviensaider {
    server 127.0.0.1:8080;
    keepalive 16;
}

# Admin links (/a/<token>) and personal links (/e/<event>/me/<token>) are
# passwords: keep them out of the access log.
map $request_uri $jeviensaider_uri {
    "~^(?<jva_pre>/a/)[^/?]+(?<jva_rest>.*)$"            "${jva_pre}***${jva_rest}";
    "~^(?<jva_pre>/e/[^/?]+/me/)[^/?]+(?<jva_rest>.*)$"  "${jva_pre}***${jva_rest}";
    default                                               $request_uri;
}

# No Referer: pages send it to their own site, so it would contain the
# secret links too.
log_format jeviensaider '$remote_addr - [$time_local] "$request_method $jeviensaider_uri $server_protocol" '
                        '$status $body_bytes_sent $request_time "$http_user_agent"';

# HTTP: certificate challenges, everything else to HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name jeviensaider.example.org;

    access_log /var/log/nginx/jeviensaider.access.log jeviensaider;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on; # nginx >= 1.25.1; on older versions use "listen 443 ssl http2;"
    server_name jeviensaider.example.org;

    ssl_certificate     /etc/letsencrypt/live/jeviensaider.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jeviensaider.example.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:jeviensaider_ssl:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    access_log /var/log/nginx/jeviensaider.access.log jeviensaider;
    error_log  /var/log/nginx/jeviensaider.error.log warn;

    # The app refuses bodies over 64 KB; stop larger ones here already.
    client_max_body_size 128k;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml text/csv;

    # The app sets its own security headers (CSP, HSTS, X-Frame-Options,
    # Referrer-Policy…): do not add them here, they would be duplicated.

    location / {
        proxy_pass http://jeviensaider;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host $host;
        # Replace, not append: the app trusts the last X-Forwarded-For entry,
        # and the client's own header must not reach it.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;

        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }

    # Static files: the app already sends long cache headers for them.
    location /static/ {
        proxy_pass http://jeviensaider;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        access_log off;
    }
}
