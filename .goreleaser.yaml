# Release binaries on a v* tag (see the release job in .github/workflows/build.yml).
# Check locally: goreleaser release --snapshot --clean
version: 2

before:
  hooks:
    - go tool templ generate # pages are templ components, their Go code is not committed

builds:
  - main: ./cmd/benevole
    binary: benevole
    env: [CGO_ENABLED=0] # pure Go SQLite driver: static binaries, no C toolchain
    flags: [-trimpath]
    ldflags: ["-s -w -X main.version={{.Version}}"]
    mod_timestamp: "{{ .CommitTimestamp }}" # reproducible builds
    goos: [linux]
    goarch: [amd64, arm64, arm]
    goarm: ["7"]

archives:
  - formats: [tar.gz]
    files: [README.md, .env.example, deploy/*]

checksum:
  name_template: checksums.txt

changelog:
  use: github-native
