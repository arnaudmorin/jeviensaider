{{define "content"}}
<section class="hero">
  <h1>Trouvez des bénévoles</h1>
  <p>Un planning par stand et par créneau. Les parents s'inscrivent en deux clics, sans compte.</p>
</section>

<div class="card narrow">
  {{with .Error}}<div class="callout error" role="alert">{{.}}</div>{{end}}
  <form method="post" action="/events" class="stack">
    <label>Nom de l'événement
      <input name="title" value="{{.Form.Title}}" required maxlength="120" placeholder="Fête de l'école 2027">
    </label>
    <div class="row2">
      <label>Date <input type="date" name="date" value="{{.Form.Date}}"></label>
      <label>Lieu <input name="location" value="{{.Form.Location}}" maxlength="120"></label>
    </div>
    <label>Message pour les bénévoles (facultatif)
      <textarea name="description" rows="2" maxlength="2000">{{.Form.Description}}</textarea>
    </label>
    {{if .NeedPassword}}
    <label>Mot de passe de création
      <input type="password" name="password" required autocomplete="current-password">
    </label>
    {{end}}
    <button type="submit" class="btn block">Créer l'événement</button>
    <p class="hint">Vous recevrez un lien d'administration secret pour gérer l'événement.</p>
  </form>
</div>
{{end}}
