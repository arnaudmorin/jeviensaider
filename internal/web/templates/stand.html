{{define "content"}}
<p><a href="{{.EventURL}}">← Retour au planning</a></p>
<div class="card narrow">{{template "stand_info" .}}</div>
{{end}}

{{define "stand_dialog"}}
<dialog class="modal" aria-labelledby="stand-title">
  <button type="button" class="close" data-close aria-label="Fermer">×</button>
  {{template "stand_info" .}}
  <div class="modal-actions"><button type="button" class="btn" data-close autofocus>Fermer</button></div>
</dialog>
{{end}}

{{define "stand_info"}}
<h2 id="stand-title" class="signup-title" style="--stand: {{css .Stand.Color}}"><span class="dot"></span>{{.Stand.Name}}</h2>
{{with .Stand.Description}}<p class="desc stand-full">{{.}}</p>{{end}}
{{end}}
