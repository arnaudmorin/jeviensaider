# Usage:
#   cp .env.example .env   # then edit it
#   docker compose pull && docker compose up -d   # prebuilt image from GitHub
#   docker compose up -d --build                  # or build it locally
services:
  app:
    build: .
    image: ghcr.io/arnaudmorin/jeviensaider:latest
    restart: unless-stopped
    ports:
      # Bound to localhost: put a reverse proxy (Caddy, nginx) in front for
      # HTTPS. Use "8080:8080" to expose it on every interface instead.
      - "127.0.0.1:${PORT:-8080}:8080"
    environment:
      BENEVOLE_BASE_URL: ${BENEVOLE_BASE_URL:-}
      BENEVOLE_TRUST_PROXY: ${BENEVOLE_TRUST_PROXY:-false}
      BENEVOLE_CREATE_PASSWORD: ${BENEVOLE_CREATE_PASSWORD:-}
      BENEVOLE_RETENTION_DAYS: ${BENEVOLE_RETENTION_DAYS:-60}
      BENEVOLE_SMTP_HOST: ${BENEVOLE_SMTP_HOST:-}
      BENEVOLE_SMTP_PORT: ${BENEVOLE_SMTP_PORT:-}
      BENEVOLE_SMTP_TLS: ${BENEVOLE_SMTP_TLS:-}
      BENEVOLE_SMTP_USERNAME: ${BENEVOLE_SMTP_USERNAME:-}
      BENEVOLE_SMTP_PASSWORD: ${BENEVOLE_SMTP_PASSWORD:-}
      BENEVOLE_SMTP_FROM: ${BENEVOLE_SMTP_FROM:-}
      BENEVOLE_OPEN_CREATION: ${BENEVOLE_OPEN_CREATION:-}
    volumes:
      - data:/data
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

volumes:
  data:
